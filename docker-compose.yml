version: "3.9"

# ForecastIQ demo — production-ready POC.
# 2 services orchestrated:
#   - forecastiq (Next.js frontend on host port 3014)
#   - forecastiq-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  forecastiq-backend:
    image: ghcr.io/wikolabs/forecastiq-backend:latest
    container_name: forecastiq-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - forecastiq-net

  forecastiq:
    image: ghcr.io/wikolabs/forecastiq:latest
    container_name: forecastiq
    restart: unless-stopped
    ports:
      - "3014:3000"
    environment:
      BACKEND_URL: "http://forecastiq-backend:8000"
    depends_on:
      - forecastiq-backend
    networks:
      - forecastiq-net

networks:
  forecastiq-net:
    name: forecastiq-net
    driver: bridge
