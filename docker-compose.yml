version: "3.9"

# ForecastIQ demo — production-ready POC.
# 2 services orchestrated:
#   - forecastiq (Next.js frontend on host port 3014)
#   - forecastiq-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  forecastiq-backend:
    image: ghcr.io/wikolabs/forecastiq-backend:latest
    container_name: forecastiq-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  forecastiq-net:
    name: forecastiq-net
    driver: bridge
