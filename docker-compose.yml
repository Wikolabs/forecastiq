version: "3.9"

# forecastiq demo - production-ready POC.
# 2 services orchestrated:
#   - forecastiq (Next.js frontend on host port 3014)
#   - forecastiq-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  forecastiq-backend:
    image: ghcr.io/wikolabs/forecastiq-backend:latest
    container_name: forecastiq-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  forecastiq:
    image: ghcr.io/wikolabs/forecastiq:latest
    container_name: forecastiq
    restart: unless-stopped
    ports:
      - "3014:3000"
    environment:
      BACKEND_URL: "http://forecastiq-backend:8000"
    depends_on:
      - forecastiq-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
